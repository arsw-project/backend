<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call Test Client</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1, h2 { color: #00d9ff; }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #0f3460;
            width: 100%;
            box-sizing: border-box;
        }
        input {
            background: #0f3460;
            color: #eee;
        }
        button {
            background: #e94560;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #ff6b6b; }
        button:disabled { background: #555; cursor: not-allowed; }
        .log {
            background: #0f3460;
            padding: 10px;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry { margin: 2px 0; }
        .log-entry.error { color: #ff6b6b; }
        .log-entry.success { color: #4eff4e; }
        .log-entry.info { color: #00d9ff; }
        #videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
        }
        video {
            width: 100%;
            background: #000;
            border-radius: 8px;
        }
        .video-container {
            position: relative;
        }
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        #chat {
            height: 150px;
            overflow-y: auto;
            background: #0f3460;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .chat-message {
            margin: 5px 0;
        }
        .chat-message .author { color: #00d9ff; font-weight: bold; }
        .participants {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .participant {
            background: #0f3460;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🎥 Video Call Test Client</h1>
    
    <div class="container">
        <div class="panel">
            <h2>Connection</h2>
            <input type="text" id="serverUrl" value="http://localhost:3002/video-call" placeholder="Server URL">
            <input type="text" id="ticketId" placeholder="Ticket ID">
            <input type="text" id="sessionToken" placeholder="Session Token (from cookie)">
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="joinBtn" onclick="joinRoom()" disabled>Join Room</button>
            <button id="leaveBtn" onclick="leaveRoom()" disabled>Leave Room</button>
            
            <h3>Participants</h3>
            <div id="participants" class="participants"></div>
        </div>

        <div class="panel">
            <h2>Media Controls</h2>
            <button id="startVideoBtn" onclick="startVideo()" disabled>Start Video</button>
            <button id="stopVideoBtn" onclick="stopVideo()" disabled>Stop Video</button>
            <button id="shareScreenBtn" onclick="shareScreen()" disabled>Share Screen</button>
            <button id="stopShareBtn" onclick="stopScreenShare()" disabled>Stop Share</button>
            
            <h3>Chat</h3>
            <div id="chat"></div>
            <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="handleChatKeyPress(event)">
            <button id="sendChatBtn" onclick="sendChat()" disabled>Send</button>
        </div>
    </div>

    <div class="panel" style="margin-top: 20px;">
        <h2>Videos</h2>
        <div id="videos">
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">You (Local)</div>
            </div>
        </div>
    </div>

    <div class="panel" style="margin-top: 20px;">
        <h2>Event Log</h2>
        <div id="log" class="log"></div>
    </div>

    <script>
        let socket = null;
        let localStream = null;
        let screenStream = null;
        let peerConnections = {}; // socketId -> RTCPeerConnection
        let pendingCandidates = {}; // socketId -> ICECandidate[]
        let mySocketId = null;

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
            ]
        };

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        function connect() {
            const url = document.getElementById('serverUrl').value;
            
            socket = io(url, {
                transports: ['websocket'],
            });

            socket.on('connect', () => {
                mySocketId = socket.id;
                log(`Connected to server (my socket: ${mySocketId})`, 'success');
                document.getElementById('joinBtn').disabled = false;
                document.getElementById('connectBtn').disabled = true;
            });

            socket.on('disconnect', () => {
                log('Disconnected from server', 'error');
                resetUI();
            });

            socket.on('error', (data) => {
                log(`Error: ${data.message} (${data.code})`, 'error');
            });

            socket.on('room-joined', async (data) => {
                log(`Joined room: ${data.ticketId} with ${data.participants.length} existing participants`, 'success');
                document.getElementById('leaveBtn').disabled = false;
                document.getElementById('joinBtn').disabled = true;
                document.getElementById('startVideoBtn').disabled = false;
                document.getElementById('sendChatBtn').disabled = false;
                
                // Update participants
                updateParticipants(data.participants);
                
                // Load chat history
                data.chatHistory.forEach(msg => addChatMessage(msg));
                
                // Wait a moment for media setup, then create peer connections with existing participants
                // We are the "polite" peer - existing participants will send offers
                log(`Will wait for offers from ${data.participants.length} existing participants`, 'info');
            });

            socket.on('room-left', () => {
                log('Left room', 'info');
                resetUI();
            });

            socket.on('room-closed', (data) => {
                log(`Room closed: ${data.reason} - ${data.message}`, 'error');
                alert(`Room was closed: ${data.message}`);
                resetUI();
            });

            socket.on('user-joined', async (data) => {
                log(`User joined: ${data.user.name} (socket: ${data.socketId})`, 'info');
                addParticipant(data.socketId, data.user);
                
                // We are an existing participant, so WE should initiate the connection
                // Create peer connection and send offer
                log(`Creating peer connection and sending offer to ${data.socketId}`, 'info');
                await createPeerConnection(data.socketId, true, data.user.name);
            });

            socket.on('user-left', (data) => {
                log(`User left: ${data.user?.name || data.socketId}`, 'info');
                removeParticipant(data.socketId);
                closePeerConnection(data.socketId);
            });

            socket.on('offer', async (data) => {
                log(`Received offer from ${data.senderSocketId}`, 'info');
                
                // Create peer connection if it doesn't exist
                if (!peerConnections[data.senderSocketId]) {
                    await createPeerConnection(data.senderSocketId, false);
                }
                
                const pc = peerConnections[data.senderSocketId];
                if (pc) {
                    try {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.signal));
                        log(`Set remote description (offer) from ${data.senderSocketId}`, 'info');
                        
                        // Process any pending ICE candidates
                        await processPendingCandidates(data.senderSocketId);
                        
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        log(`Sending answer to ${data.senderSocketId}`, 'info');
                        
                        socket.emit('answer', {
                            targetSocketId: data.senderSocketId,
                            signal: answer
                        });
                    } catch (err) {
                        log(`Error handling offer: ${err.message}`, 'error');
                    }
                }
            });

            socket.on('answer', async (data) => {
                log(`Received answer from ${data.senderSocketId}`, 'info');
                const pc = peerConnections[data.senderSocketId];
                if (pc) {
                    try {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.signal));
                        log(`Set remote description (answer) from ${data.senderSocketId}`, 'success');
                        
                        // Process any pending ICE candidates
                        await processPendingCandidates(data.senderSocketId);
                    } catch (err) {
                        log(`Error handling answer: ${err.message}`, 'error');
                    }
                }
            });

            socket.on('ice-candidate', async (data) => {
                const pc = peerConnections[data.senderSocketId];
                if (pc && data.signal) {
                    try {
                        if (pc.remoteDescription) {
                            await pc.addIceCandidate(new RTCIceCandidate(data.signal));
                            log(`Added ICE candidate from ${data.senderSocketId}`, 'info');
                        } else {
                            // Queue the candidate until we have the remote description
                            if (!pendingCandidates[data.senderSocketId]) {
                                pendingCandidates[data.senderSocketId] = [];
                            }
                            pendingCandidates[data.senderSocketId].push(data.signal);
                            log(`Queued ICE candidate from ${data.senderSocketId}`, 'info');
                        }
                    } catch (err) {
                        log(`Error adding ICE candidate: ${err.message}`, 'error');
                    }
                }
            });

            socket.on('chat-message', (msg) => {
                addChatMessage(msg);
            });

            socket.on('screen-share-started', (data) => {
                log(`User ${data.socketId} started screen sharing`, 'info');
            });

            socket.on('screen-share-stopped', (data) => {
                log(`User ${data.socketId} stopped screen sharing`, 'info');
            });
        }

        async function processPendingCandidates(socketId) {
            const candidates = pendingCandidates[socketId];
            if (candidates && candidates.length > 0) {
                const pc = peerConnections[socketId];
                for (const candidate of candidates) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch (err) {
                        log(`Error adding queued ICE candidate: ${err.message}`, 'error');
                    }
                }
                log(`Processed ${candidates.length} queued ICE candidates for ${socketId}`, 'info');
                delete pendingCandidates[socketId];
            }
        }

        function joinRoom() {
            const ticketId = document.getElementById('ticketId').value;
            const sessionToken = document.getElementById('sessionToken').value;
            
            if (!ticketId || !sessionToken) {
                log('Please enter Ticket ID and Session Token', 'error');
                return;
            }

            socket.emit('join-room', { ticketId, sessionToken });
        }

        function leaveRoom() {
            socket.emit('leave-room');
            Object.keys(peerConnections).forEach(closePeerConnection);
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
        }

        async function startVideo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('stopVideoBtn').disabled = false;
                document.getElementById('shareScreenBtn').disabled = false;
                
                log(`Started local video with ${localStream.getTracks().length} tracks`, 'success');
                
                // Add tracks to all existing peer connections and renegotiate
                const peerIds = Object.keys(peerConnections);
                log(`Adding tracks to ${peerIds.length} peer connections`, 'info');
                
                for (const socketId of peerIds) {
                    const pc = peerConnections[socketId];
                    
                    // Add tracks if not already added
                    const senders = pc.getSenders();
                    localStream.getTracks().forEach(track => {
                        const existingSender = senders.find(s => s.track?.kind === track.kind);
                        if (!existingSender) {
                            pc.addTrack(track, localStream);
                            log(`Added ${track.kind} track to ${socketId}`, 'info');
                        }
                    });
                    
                    // Renegotiate
                    try {
                        const offer = await pc.createOffer({
                            offerToReceiveAudio: true,
                            offerToReceiveVideo: true
                        });
                        await pc.setLocalDescription(offer);
                        socket.emit('offer', {
                            targetSocketId: socketId,
                            signal: pc.localDescription
                        });
                        log(`Sent renegotiation offer to ${socketId}`, 'info');
                    } catch (err) {
                        log(`Error renegotiating with ${socketId}: ${err.message}`, 'error');
                    }
                }
                
                log('Video started and shared with peers', 'success');
            } catch (err) {
                log(`Failed to start video: ${err.message}`, 'error');
            }
        }

        function stopVideo() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                document.getElementById('localVideo').srcObject = null;
                document.getElementById('stopVideoBtn').disabled = true;
                log('Video stopped', 'info');
            }
        }

        async function shareScreen() {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true // Try to capture audio too
                });
                
                log('Screen capture started', 'success');
                
                // Show screen share in local video (optional - can add separate element)
                const screenVideoEl = document.getElementById('screenShareVideo');
                if (screenVideoEl) {
                    screenVideoEl.srcObject = screenStream;
                }
                
                // Replace video track with screen track in all peer connections
                const screenTrack = screenStream.getVideoTracks()[0];
                
                for (const [socketId, pc] of Object.entries(peerConnections)) {
                    const sender = pc.getSenders().find(s => s.track?.kind === 'video');
                    if (sender) {
                        await sender.replaceTrack(screenTrack);
                        log(`Replaced video track with screen for ${socketId}`, 'info');
                    } else {
                        // No video sender, add the screen track
                        pc.addTrack(screenTrack, screenStream);
                        log(`Added screen track to ${socketId}`, 'info');
                        
                        // Renegotiate
                        try {
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            socket.emit('offer', {
                                targetSocketId: socketId,
                                signal: pc.localDescription
                            });
                        } catch (err) {
                            log(`Error renegotiating screen share: ${err.message}`, 'error');
                        }
                    }
                }
                
                document.getElementById('stopShareBtn').disabled = false;
                document.getElementById('shareScreenBtn').disabled = true;
                socket.emit('screen-share-started');
                log('Screen sharing started and sent to peers', 'success');
                
                screenTrack.onended = () => {
                    stopScreenShare();
                };
            } catch (err) {
                log(`Failed to share screen: ${err.message}`, 'error');
            }
        }

        async function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
                
                // Restore camera track
                if (localStream) {
                    const cameraTrack = localStream.getVideoTracks()[0];
                    for (const [socketId, pc] of Object.entries(peerConnections)) {
                        const sender = pc.getSenders().find(s => s.track?.kind === 'video');
                        if (sender && cameraTrack) {
                            await sender.replaceTrack(cameraTrack);
                            log(`Restored camera track for ${socketId}`, 'info');
                        }
                    }
                }
                
                document.getElementById('stopShareBtn').disabled = true;
                document.getElementById('shareScreenBtn').disabled = false;
                socket.emit('screen-share-stopped');
                log('Screen sharing stopped', 'info');
            }
        }

        function createPeerConnection(socketId, initiator, userName = '') {
            log(`Creating peer connection to ${socketId}, initiator: ${initiator}`, 'info');
            
            // Don't create connection to ourselves
            if (socketId === mySocketId) {
                log(`Skipping peer connection to self`, 'info');
                return null;
            }
            
            // Close existing connection if any
            if (peerConnections[socketId]) {
                log(`Closing existing connection to ${socketId}`, 'info');
                peerConnections[socketId].close();
            }
            
            const pc = new RTCPeerConnection(iceServers);
            peerConnections[socketId] = pc;

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    log(`Sending ICE candidate to ${socketId}`, 'info');
                    socket.emit('ice-candidate', {
                        targetSocketId: socketId,
                        signal: event.candidate
                    });
                }
            };

            pc.oniceconnectionstatechange = () => {
                log(`ICE connection state with ${socketId}: ${pc.iceConnectionState}`, 
                    pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed' ? 'success' : 'info');
            };

            pc.onconnectionstatechange = () => {
                log(`Connection state with ${socketId}: ${pc.connectionState}`,
                    pc.connectionState === 'connected' ? 'success' : 'info');
            };

            pc.ontrack = (event) => {
                log(`Received track from ${socketId}: ${event.track.kind}`, 'success');
                
                let video = document.getElementById(`video-${socketId}`);
                if (!video) {
                    log(`Creating video element for ${socketId}`, 'info');
                    const container = document.createElement('div');
                    container.className = 'video-container';
                    container.id = `container-${socketId}`;
                    
                    video = document.createElement('video');
                    video.id = `video-${socketId}`;
                    video.autoplay = true;
                    video.playsinline = true;
                    video.setAttribute('autoplay', '');
                    video.setAttribute('playsinline', '');
                    
                    const label = document.createElement('div');
                    label.className = 'video-label';
                    label.textContent = userName || socketId.substring(0, 8);
                    label.id = `label-${socketId}`;
                    
                    container.appendChild(video);
                    container.appendChild(label);
                    document.getElementById('videos').appendChild(container);
                }
                
                // Set the stream
                if (event.streams && event.streams[0]) {
                    video.srcObject = event.streams[0];
                    log(`Set stream for ${socketId}, tracks: ${event.streams[0].getTracks().map(t => t.kind).join(', ')}`, 'success');
                } else {
                    // Create a new MediaStream and add the track
                    const stream = new MediaStream();
                    stream.addTrack(event.track);
                    video.srcObject = stream;
                    log(`Created new stream for ${socketId} with track: ${event.track.kind}`, 'success');
                }
                
                // Ensure video plays
                video.play().catch(err => {
                    log(`Error playing video: ${err.message}`, 'error');
                });
            };

            // Add local tracks if available
            if (localStream) {
                log(`Adding ${localStream.getTracks().length} local tracks to peer connection`, 'info');
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                    log(`Added local ${track.kind} track to ${socketId}`, 'info');
                });
            } else {
                log(`No local stream available yet for ${socketId}`, 'info');
            }

            // If we're the initiator, create and send offer after a short delay
            if (initiator) {
                setTimeout(async () => {
                    try {
                        log(`Creating offer for ${socketId}`, 'info');
                        const offer = await pc.createOffer({
                            offerToReceiveAudio: true,
                            offerToReceiveVideo: true
                        });
                        await pc.setLocalDescription(offer);
                        log(`Sending offer to ${socketId}`, 'info');
                        socket.emit('offer', {
                            targetSocketId: socketId,
                            signal: pc.localDescription
                        });
                    } catch (err) {
                        log(`Error creating offer: ${err.message}`, 'error');
                    }
                }, 500);
            }

            return pc;
        }

        function closePeerConnection(socketId) {
            log(`Closing peer connection to ${socketId}`, 'info');
            
            const pc = peerConnections[socketId];
            if (pc) {
                pc.close();
                delete peerConnections[socketId];
            }
            
            // Clean up pending candidates
            delete pendingCandidates[socketId];
            
            const container = document.getElementById(`container-${socketId}`);
            if (container) {
                container.remove();
                log(`Removed video container for ${socketId}`, 'info');
            }
        }

        function updateParticipants(participants) {
            const div = document.getElementById('participants');
            div.innerHTML = '';
            participants.forEach(p => {
                addParticipant(p.socketId, p.user);
                // Update label if video element exists
                const label = document.getElementById(`label-${p.socketId}`);
                if (label) {
                    label.textContent = p.user.name;
                }
            });
        }

        function addParticipant(socketId, user) {
            const div = document.getElementById('participants');
            const badge = document.createElement('div');
            badge.className = 'participant';
            badge.id = `participant-${socketId}`;
            badge.textContent = user.name;
            div.appendChild(badge);
        }

        function removeParticipant(socketId) {
            const badge = document.getElementById(`participant-${socketId}`);
            if (badge) badge.remove();
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (content && socket) {
                socket.emit('chat-message', { content });
                input.value = '';
            }
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChat();
            }
        }

        function addChatMessage(msg) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'chat-message';
            div.innerHTML = `<span class="author">${msg.userName}:</span> ${msg.content}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function resetUI() {
            // Close all peer connections
            Object.keys(peerConnections).forEach(closePeerConnection);
            peerConnections = {};
            pendingCandidates = {};
            
            // Stop local media
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                document.getElementById('localVideo').srcObject = null;
            }
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
            }
            
            // Reset buttons
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('joinBtn').disabled = true;
            document.getElementById('leaveBtn').disabled = true;
            document.getElementById('startVideoBtn').disabled = true;
            document.getElementById('stopVideoBtn').disabled = true;
            document.getElementById('shareScreenBtn').disabled = true;
            document.getElementById('stopShareBtn').disabled = true;
            document.getElementById('sendChatBtn').disabled = true;
            document.getElementById('participants').innerHTML = '';
            document.getElementById('chat').innerHTML = '';
            
            // Remove all remote video elements
            const videos = document.getElementById('videos');
            const remoteContainers = videos.querySelectorAll('.video-container:not(:first-child)');
            remoteContainers.forEach(c => c.remove());
            
            log('UI reset', 'info');
        }
    </script>
</body>
</html>
