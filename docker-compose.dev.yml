services:
  # ===========================================================================
  # DATABASES ONLY (for development)
  # ===========================================================================
  
  # Main backend database
  main-db:
    image: postgres:16-alpine
    container_name: nexus-main-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_main
    ports:
      - "5432:5432"
    volumes:
      - main-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_main"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network-dev

  # Tickets microservice database
  tickets-db:
    image: postgres:16-alpine
    container_name: nexus-tickets-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_tickets
    ports:
      - "5433:5432"
    volumes:
      - tickets-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_tickets"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network-dev

  # Video Call microservice database
  video-call-db:
    image: postgres:16-alpine
    container_name: nexus-video-call-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_video_call
    ports:
      - "5434:5432"
    volumes:
      - video-call-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_video_call"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network-dev

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  main-db-data-dev:
    driver: local
  tickets-db-data-dev:
    driver: local
  video-call-db-data-dev:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  nexus-network-dev:
    driver: bridge
