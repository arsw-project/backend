services:
  # ===========================================================================
  # DATABASES
  # ===========================================================================
  
  # Main backend database
  main-db:
    image: postgres:16-alpine
    container_name: nexus-main-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MAIN_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${MAIN_DB_NAME:-nexus_main}
    ports:
      - "${MAIN_DB_PORT:-5432}:5432"
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USER:-postgres} -d ${MAIN_DB_NAME:-nexus_main}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

  # Tickets microservice database
  tickets-db:
    image: postgres:16-alpine
    container_name: nexus-tickets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TICKETS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TICKETS_DB_NAME:-nexus_tickets}
    ports:
      - "${TICKETS_DB_PORT:-5433}:5432"
    volumes:
      - tickets-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TICKETS_DB_USER:-postgres} -d ${TICKETS_DB_NAME:-nexus_tickets}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

  # Video Call microservice database
  video-call-db:
    image: postgres:16-alpine
    container_name: nexus-video-call-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VIDEO_CALL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${VIDEO_CALL_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${VIDEO_CALL_DB_NAME:-nexus_video_call}
    ports:
      - "${VIDEO_CALL_DB_PORT:-5434}:5432"
    volumes:
      - video-call-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIDEO_CALL_DB_USER:-postgres} -d ${VIDEO_CALL_DB_NAME:-nexus_video_call}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

  # ===========================================================================
  # BACKEND SERVICES
  # ===========================================================================

  # Main backend (monolith)
  main-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-main-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DRIZZLE_DATABASE_URL: postgresql://${MAIN_DB_USER:-postgres}:${MAIN_DB_PASSWORD:-postgres}@main-db:5432/${MAIN_DB_NAME:-nexus_main}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_LOGIN_REDIRECT: ${GOOGLE_LOGIN_REDIRECT:-http://localhost:5173}
      HOST: ${HOST:-http://localhost:3000}
      SERVICE_SECRET_KEY: ${SERVICE_SECRET_KEY:-super-secret-service-key}
      LOGGING_CONSOLE_ENABLED: ${LOGGING_CONSOLE_ENABLED:-true}
      LOGGING_FILE_ENABLED: ${LOGGING_FILE_ENABLED:-false}
      LOGGING_FILE_PATH: ${LOGGING_FILE_PATH:-logs/app.log}
      LOGGING_EXTERNAL_ENABLED: ${LOGGING_EXTERNAL_ENABLED:-false}
      LOGGING_EXTERNAL_URL: ${LOGGING_EXTERNAL_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      main-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nexus-network
    volumes:
      - main-backend-logs:/app/logs

  # Tickets microservice
  tickets-ms:
    build:
      context: .
      dockerfile: apps/tickets-ms/Dockerfile
    container_name: nexus-tickets-ms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TICKETS_MS_PORT: 3001
      TICKETS_DATABASE_URL: postgresql://${TICKETS_DB_USER:-postgres}:${TICKETS_DB_PASSWORD:-postgres}@tickets-db:5432/${TICKETS_DB_NAME:-nexus_tickets}
      MONOLITH_URL: http://main-backend:3000
      SERVICE_SECRET_KEY: ${SERVICE_SECRET_KEY:-super-secret-service-key}
    ports:
      - "3001:3001"
    depends_on:
      tickets-db:
        condition: service_healthy
      main-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nexus-network

  # Video Call microservice
  video-call-ms:
    build:
      context: .
      dockerfile: apps/video-call-ms/Dockerfile
    container_name: nexus-video-call-ms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DRIZZLE_DATABASE_URL: postgresql://${VIDEO_CALL_DB_USER:-postgres}:${VIDEO_CALL_DB_PASSWORD:-postgres}@video-call-db:5432/${VIDEO_CALL_DB_NAME:-nexus_video_call}
      MONOLITH_URL: http://main-backend:3000
      TICKETS_MS_URL: http://tickets-ms:3001
      SERVICE_SECRET_KEY: ${SERVICE_SECRET_KEY:-super-secret-service-key}
      ROOM_INACTIVITY_TIMEOUT_MINUTES: ${ROOM_INACTIVITY_TIMEOUT_MINUTES:-30}
    ports:
      - "3002:3002"
    depends_on:
      video-call-db:
        condition: service_healthy
      main-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nexus-network

  # ===========================================================================
  # NGINX REVERSE PROXY
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-5656}:80"
      - "${NGINX_HTTPS_PORT:-5657}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Uncomment for SSL certificates
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      main-backend:
        condition: service_healthy
      tickets-ms:
        condition: service_healthy
      video-call-ms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexus-network

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  main-db-data:
    driver: local
  tickets-db-data:
    driver: local
  video-call-db-data:
    driver: local
  main-backend-logs:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
