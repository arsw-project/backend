# =============================================================================
# Nexus Backend - Default Server Configuration
# =============================================================================
# This file configures the reverse proxy routing for all services
# Routes:
#   - /tickets/*    -> Tickets Microservice
#   - /video-call/* -> Video Call Microservice
#   - /*            -> Main Backend
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # ==========================================================================
    # GENERAL SETTINGS
    # ==========================================================================
    client_max_body_size 10M;
    
    # Connection limits
    limit_conn conn_limit 20;

    # ==========================================================================
    # HEALTH CHECK ENDPOINT
    # ==========================================================================
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================================================
    # TICKETS MICROSERVICE ROUTES (/tickets/*)
    # ==========================================================================
    location /tickets {
        limit_req zone=api_limit burst=20 nodelay;
       
	if ($request_method = 'OPTIONS') {
        	add_header 'Access-Control-Allow-Origin' '$http_origin';
        	add_header 'Access-Control-Allow-Credentials' 'true';
        	add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
        	add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        	add_header 'Access-Control-Max-Age' 1728000;
        	add_header 'Content-Type' 'text/plain; charset=utf-8';
        	add_header 'Content-Length' 0;
        	return 204; # Return No Content (204) immediately
        }
        # Handle CORS preflight requests
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        # Strip /tickets prefix before proxying	
	# rewrite ^/tickets(.*) $1 break;
	proxy_pass http://localhost:3001;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # ==========================================================================
    # VIDEO CALL MICROSERVICE ROUTES (/video-call/*)
    # ==========================================================================
    
    # Video Call REST API
    location ~ ^/video-call(/|$) {
        limit_req zone=api_limit burst=20 nodelay;
        if ($request_method = 'OPTIONS') {
        	add_header 'Access-Control-Allow-Origin' '$http_origin';
        	add_header 'Access-Control-Allow-Credentials' 'true';
        	add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
        	add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        	add_header 'Access-Control-Max-Age' 1728000;
        	add_header 'Content-Type' 'text/plain; charset=utf-8';
        	add_header 'Content-Length' 0;
        	return 204; # Return No Content (204) immediately
        
	}
        # Handle CORS preflight requests
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # Strip /video-call prefix before proxying
        rewrite ^/video-call(.*) $1 break;
        proxy_pass http://localhost:3002;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Socket.IO WebSocket endpoint (under /video-call)
    location /video-call/socket.io/ {
        proxy_pass http://localhost:3002/socket.io/;
        
        # WebSocket specific settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Extended timeouts for WebSocket
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;  # 1 hour for long-lived connections
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for real-time communication
        proxy_buffering off;
        proxy_cache off;
    }

    # ==========================================================================
    # MAIN BACKEND (everything else -> /)
    # ==========================================================================
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://localhost:3000/;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # ==========================================================================
    # ERROR PAGES
    # ==========================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

